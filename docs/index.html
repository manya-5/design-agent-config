<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design-agent-config | Manya Singh</title>
<meta name="description" content="My Cursor rules and Claude Code setup for design work.">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: var(--weight-regular) var(--text-base)/var(--leading-body) var(--font-sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--color-accent); }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--space-5); }
  .top { display: flex; justify-content: space-between; align-items: center; padding: var(--space-5) 0; font-size: var(--text-sm); }
  .top a { color: var(--color-ink); text-decoration: none; }
  .top .home { font-family: var(--font-serif); font-size: var(--text-md); }

  .intro { padding: var(--space-7) 0 var(--space-6); display: grid; grid-template-columns: 1.7fr 1fr; gap: var(--space-6); align-items: end; }
  .intro h1 { font-family: var(--font-serif); font-weight: 400; font-size: clamp(2.2rem, 5.4vw, 4rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0; overflow-wrap: anywhere; }
  .intro p { margin: 0; color: var(--color-ink-muted); font-size: var(--text-md); line-height: var(--leading-snug); max-width: 32ch; }

  .viewer { display: grid; grid-template-columns: 280px minmax(0, 1fr); border: 1px solid var(--color-line); border-radius: var(--radius-lg); background: var(--color-surface); overflow: hidden; margin-bottom: var(--space-8); min-height: 520px; }
  .files { border-right: 1px solid var(--color-line); padding: var(--space-3); display: grid; align-content: start; gap: 2px; }
  .group { font-size: var(--text-xs); color: var(--color-ink-muted); padding: var(--space-3) var(--space-3) var(--space-1); }
  .file { text-align: left; border: 0; background: none; font: inherit; color: var(--color-ink); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); cursor: pointer; display: grid; gap: 2px; }
  .file small { color: var(--color-ink-muted); font-size: var(--text-xs); line-height: var(--leading-snug); }
  .file span { font-size: var(--text-sm); font-weight: var(--weight-medium); }
  .file:hover { background: var(--color-paper); }
  .file[aria-selected="true"] { background: var(--color-paper); box-shadow: inset 2px 0 0 var(--color-accent); }

  .pane { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
  .pane-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-line); font-size: var(--text-sm); }
  .path { color: var(--color-ink-muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { font: inherit; font-size: var(--text-sm); font-weight: var(--weight-medium); padding: 4px 12px; border-radius: var(--radius-md); border: 1px solid var(--color-line); background: var(--color-surface); color: var(--color-ink); cursor: pointer; }
  pre { margin: 0; padding: var(--space-5); overflow: auto; font-size: var(--text-sm); line-height: 1.6; white-space: pre-wrap; }
  .fm { color: var(--color-ink-muted); }
  .h { color: var(--color-accent); font-weight: var(--weight-semibold); }

  @media (max-width: 820px) {
    .intro { grid-template-columns: 1fr; gap: var(--space-4); }
    .viewer { grid-template-columns: 1fr; }
    .files { border-right: 0; border-bottom: 1px solid var(--color-line); }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top"><a class="home" href="https://github.com/manya-5">manya-5</a><a href="https://github.com/manya-5/design-agent-config">Source</a></nav>
  <header class="intro">
    <h1>design-agent-config</h1>
    <p>The rules I give Cursor and Claude Code when I design in code. Copy any file, or install them all with one script.</p>
  </header>

  <div class="viewer">
    <div class="files" role="tablist" aria-label="Files" id="files"></div>
    <div class="pane" role="tabpanel" id="pane">
      <div class="pane-head"><span class="path" id="path"></span><button class="btn" id="copy" type="button">Copy</button></div>
      <pre id="code"></pre>
    </div>
  </div>
</div>
<script>
  const FILES = [
    { group: "Cursor rules", name: "style.mdc", path: ".cursor/rules/style.mdc", note: "Always on. Tone, no em dashes, React and Tailwind." },
    { name: "verify-in-browser.mdc", path: ".cursor/rules/verify-in-browser.mdc", note: "Open the page, read the console, fix, repeat." },
    { name: "ui-states.mdc", path: ".cursor/rules/ui-states.mdc", note: "Every component ships with every state." },
    { name: "ai-features.mdc", path: ".cursor/rules/ai-features.mdc", note: "Preview, approve, run visibly, report." },
    { group: "Claude Code", name: "CLAUDE.md", path: "~/.claude/CLAUDE.md", note: "The same habits, for Claude Code." },
    { name: "settings.json", path: "~/.claude/settings.json", note: "Commits and PRs stay mine, with no attribution lines." },
  ];
  const list = document.getElementById("files"), code = document.getElementById("code"), path = document.getElementById("path"), copyBtn = document.getElementById("copy");
  let current = "";

  function escape(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
  function highlight(text) {
    // Dim the frontmatter and color headings, so the rules themselves stand out.
    let out = escape(text);
    out = out.replace(/^---\n[\s\S]*?\n---/, (m) => `<span class="fm">${m}</span>`);
    out = out.replace(/^(#+ .*|[A-Z][\w ]*:)$/gm, (m) => `<span class="h">${m}</span>`);
    return out;
  }
  async function open(i) {
    const f = FILES[i];
    list.querySelectorAll(".file").forEach((b, j) => { b.setAttribute("aria-selected", String(i === j)); b.tabIndex = i === j ? 0 : -1; });
    path.textContent = f.path;
    current = await (await fetch("files/" + f.name)).text();
    code.innerHTML = highlight(current);
    copyBtn.textContent = "Copy";
  }
  FILES.forEach((f, i) => {
    if (f.group) { const g = document.createElement("div"); g.className = "group"; g.textContent = f.group; list.append(g); }
    const b = document.createElement("button");
    b.className = "file"; b.type = "button"; b.setAttribute("role", "tab");
    b.innerHTML = `<span>${f.name}</span><small>${f.note}</small>`;
    b.onclick = () => open(i);
    b.onkeydown = (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const next = (i + (e.key === "ArrowDown" ? 1 : FILES.length - 1)) % FILES.length;
        open(next); list.querySelectorAll(".file")[next].focus();
      }
    };
    list.append(b);
  });
  copyBtn.onclick = async () => {
    try { await navigator.clipboard.writeText(current); copyBtn.textContent = "Copied"; }
    catch (e) { copyBtn.textContent = "Select and copy"; }
  };
  open(0);
</script>
</body>
</html>
